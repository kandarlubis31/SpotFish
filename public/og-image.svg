<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Wave pattern -->
  <path d="M0 500 Q200 460 400 500 Q600 540 800 500 Q1000 460 1200 500 L1200 630 L0 630 Z" fill="url(#wave)" opacity="0.5"/>
  <path d="M0 520 Q300 480 600 520 Q900 560 1200 520 L1200 630 L0 630 Z" fill="url(#wave)" opacity="0.3"/>
  
  <!-- Pin icon -->
  <g transform="translate(560, 160) scale(2.5)">
    <path d="M0 -40 C-20 -40 -32 -28 -32 -16 C-32 4 0 32 0 32 C0 32 32 4 32 -16 C32 -28 20 -40 0 -40Z" fill="white" opacity="0.95"/>
    <g transform="translate(0,-10) scale(0.5)">
      <ellipse cx="0" cy="0" rx="16" ry="8" fill="#2563eb"/>
      <path d="M12 -2 L20 -8 L20 8 L12 2" fill="#2563eb"/>
      <circle cx="-8" cy="-2" r="2" fill="white"/>
      <path d="M-2 -1 Q0 -3 2 -1" stroke="white" stroke-width="1.5" fill="none"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="white">SpotFish!</text>
  
  <!-- Subtitle -->
  <text x="600" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="white" opacity="0.9">Peta Komunitas Spot Mancing Indonesia</text>
  
  <!-- URL -->
  <text x="600" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="white" opacity="0.7">spotfish.app</text>
  
  <!-- Decorative fish -->
  <g transform="translate(180, 420) scale(0.8)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="white"/>
    <path d="M9 -1 L15 -5 L15 5 L9 1" fill="white"/>
    <circle cx="-6" cy="-1.5" r="1.5" fill="#2563eb"/>
  </g>
  <g transform="translate(1020, 380) scale(0.6)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="white"/>
    <path d="M9 -1 L15 -5 L15 5 L9 1" fill="white"/>
    <circle cx="-6" cy="-1.5" r="1.5" fill="#2563eb"/>
  </g>
</svg>
