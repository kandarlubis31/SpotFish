  </defs>
  <!-- Pin body -->
  <path d="M32 4 C20 4 10 14 10 26 C10 40 32 60 32 60 C32 60 54 40 54 26 C54 14 44 4 32 4Z" 
        fill="url(#pinGrad)" filter="url(#shadow)"/>
